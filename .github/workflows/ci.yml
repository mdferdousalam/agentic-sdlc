name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Guard, receipts and detection
        run: python3 tests/test_sdlc.py

  structure:
    name: Plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Manifests parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   hooks/hooks.json schema/sdlc.config.schema.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok: $f"
          done
      - name: Validate agents, commands, skills, hooks and the CLI
        run: node .github/scripts/validate-plugin.mjs
      - name: A generated config satisfies the schema
        run: |
          # A real file, not process substitution: ajv opens the path by name and
          # /dev/fd pipes are gone by the time it does.
          python3 bin/sdlc init > /tmp/sdlc.config.generated.json
          npx --yes ajv-cli@5 validate \
            -s schema/sdlc.config.schema.json \
            -d /tmp/sdlc.config.generated.json --spec=draft2020 --strict=false

  shell:
    name: Shell and Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck bin/sdlc-install-opencode
      - name: python syntax and a byte-compile
        run: python3 -m py_compile bin/sdlc tests/test_sdlc.py
      - name: the CLI is executable
        run: test -x bin/sdlc && test -x bin/sdlc-install-opencode && test -x install.sh
      - name: installer shell syntax
        run: sh -n install.sh && shellcheck install.sh
      - name: npm package is coherent
        run: |
          node --check npm/cli.js
          node -e "const p=require('./package.json');
            const fs=require('fs');
            if(!fs.existsSync(p.bin.sdlc)) throw new Error('bin path missing: '+p.bin.sdlc);
            const pl=require('./.claude-plugin/plugin.json');
            if(p.version!==pl.version) throw new Error('package.json '+p.version+' != plugin.json '+pl.version);
            console.log('npm package ok, version '+p.version);"
      - name: the packed tarball runs
        run: |
          npm pack >/dev/null
          mkdir -p /tmp/pk && tar xzf mdferdousalam-agentic-sdlc-*.tgz -C /tmp/pk
          node /tmp/pk/package/npm/cli.js --help > /dev/null && echo "packed CLI runs"

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npx --yes markdownlint-cli2
